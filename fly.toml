app = "webring-directory"
primary_region = "yyz"

[build]

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/directory.db"
  TRUST_PROXY = "1"

[[mounts]]
  source = "webring_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
